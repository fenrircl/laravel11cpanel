<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Lógica Estados Facturas</title>
</head>
<body>
    <h2>Test Lógica de Estados de Facturas</h2>
    <div id="resultado"></div>

    <script>
    // Simulación de la lógica del buscador
    function getEstadoFactura(item) {
        const isPagada = Number(item.status) === 1;
        
        if (isPagada) {
            return { tipo: 'pagada', html: '<span class="badge bg-success text-white">✅ Pagada</span>' };
        } else {
            // Verificar si está vencida
            const fechaVencimiento = item.expiry || item.fecha_vencimiento;
            const hoy = new Date();
            hoy.setHours(0, 0, 0, 0); // Reiniciar horas para comparar solo fechas
            
            let estaVencida = false;
            if (fechaVencimiento) {
                const fechaVenc = new Date(fechaVencimiento);
                fechaVenc.setHours(0, 0, 0, 0);
                estaVencida = fechaVenc < hoy;
            }
            
            if (estaVencida) {
                return { tipo: 'vencida', html: '<span class="badge bg-danger text-white">⚠️ Vencida</span>' };
            } else {
                return { tipo: 'pendiente', html: '<span class="badge bg-warning text-dark">⏳ Pendiente</span>' };
            }
        }
    }

    // Casos de prueba
    const facturasPrueba = [
        { id: 1, status: 1, expiry: '2024-12-01', description: 'Factura pagada' },
        { id: 2, status: 0, expiry: '2025-02-15', description: 'Factura pendiente (vence en el futuro)' },
        { id: 3, status: 0, expiry: '2024-11-15', description: 'Factura vencida (venció hace tiempo)' },
        { id: 4, status: 0, expiry: null, description: 'Factura sin fecha vencimiento' },
        { id: 5, status: 1, expiry: '2024-10-01', description: 'Factura pagada que estaba vencida' }
    ];

    let resultadoHtml = '<table border="1" cellpadding="10" style="border-collapse: collapse; width: 100%;">';
    resultadoHtml += '<tr><th>ID</th><th>Status</th><th>Vencimiento</th><th>Descripción</th><th>Estado Calculado</th><th>Badge</th></tr>';

    facturasPrueba.forEach(factura => {
        const estado = getEstadoFactura(factura);
        resultadoHtml += `<tr>
            <td>${factura.id}</td>
            <td>${factura.status}</td>
            <td>${factura.expiry || 'Sin fecha'}</td>
            <td>${factura.description}</td>
            <td>${estado.tipo}</td>
            <td>${estado.html}</td>
        </tr>`;
    });

    resultadoHtml += '</table>';
    
    // Mostrar fecha actual para referencia
    const hoy = new Date();
    resultadoHtml = `<p><strong>Fecha actual:</strong> ${hoy.toLocaleDateString('es-ES')} (${hoy.toISOString().split('T')[0]})</p>` + resultadoHtml;
    
    document.getElementById('resultado').innerHTML = resultadoHtml;
    </script>
</body>
</html>
