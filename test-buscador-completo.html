<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Completo Buscador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="/assets/css/comun/buscador.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <h2 class="mb-4">Test Completo - Buscador con Estados</h2>
        
        <button id="testBtn" class="btn btn-primary mb-3">Generar Resultados de Prueba</button>
        <button id="clearBtn" class="btn btn-secondary mb-3">Limpiar</button>
        
        <!-- Simulación del dropdown de resultados -->
        <div id="search-results" class="search-results-dropdown" style="position: relative; display: none; max-height: none;">
        </div>
        
        <div class="mt-4">
            <h5>Console Log Output:</h5>
            <textarea id="console-output" class="form-control" rows="10" readonly></textarea>
        </div>
    </div>

    <script>
    // Sobrescribir console.log para capturar output
    let consoleOutput = '';
    const originalLog = console.log;
    console.log = function(...args) {
        consoleOutput += args.join(' ') + '\n';
        document.getElementById('console-output').value = consoleOutput;
        originalLog.apply(console, arguments);
    };

    // Simular clase GlobalSearchManager simplificada
    class TestSearchManager {
        getEntityIcon(entity) {
            const icons = {
                clientes: 'fas fa-user-tie',
                proveedores: 'fas fa-industry',
                facturas: 'fas fa-file-invoice',
                'factura-cliente': 'fas fa-file-invoice',
                'factura-proveedor': 'fas fa-file-invoice-dollar'
            };
            return icons[entity] || 'fas fa-circle';
        }

        getItemTitle(item, entity) {
            switch (entity) {
                case 'clientes':
                case 'proveedores':
                    return item.name || `${entity.slice(0, -1)} #${item.id}`;
                case 'facturas':
                    const tipoFactura = item.client_id || item.cliente_id || item.cliente_name ? 'Cliente' : 
                                      (item.provider_id || item.proveedor_id || item.proveedor_name ? 'Proveedor' : '');
                    const numeroFactura = item.invoice || item.numero || item.id;
                    return tipoFactura ? 
                        `Factura ${tipoFactura} #${numeroFactura}` : 
                        `Factura #${numeroFactura}`;
                default:
                    return `Registro #${item.id}`;
            }
        }

        getItemSubtitle(item, entity) {
            switch (entity) {
                case 'facturas':
                    const infoItems = [];
                    
                    if (item.cliente_name || item.client_name) {
                        infoItems.push(`👤 ${item.cliente_name || item.client_name}`);
                    } else if (item.proveedor_name || item.provider_name) {
                        infoItems.push(`🏢 ${item.proveedor_name || item.provider_name}`);
                    }
                    
                    if (item.fecha_emision || item.date || item.created_at) {
                        const fecha = new Date(item.fecha_emision || item.date || item.created_at).toLocaleDateString('es-ES');
                        infoItems.push(`📅 ${fecha}`);
                    }
                    
                    return infoItems.length > 0 ? infoItems.join(' • ') : 'Información no disponible';
                default:
                    return '';
            }
        }

        getItemMeta(item, entity) {
            // Debug temporal
            if (entity === 'facturas') {
                console.log('🔍 getItemMeta DEBUG - Factura:', {
                    id: item.id,
                    status: item.status,
                    statusType: typeof item.status,
                    amount: item.amount,
                    total: item.total,
                    expiry: item.expiry,
                    fecha_vencimiento: item.fecha_vencimiento,
                    item: item
                });
            }
            
            switch (entity) {
                case 'facturas':
                    const metaItems = [];
                    
                    // Mostrar monto si está disponible
                    const monto = item.amount || item.total || item.monto;
                    if (monto) {
                        const montoFormateado = `$${Number(monto).toLocaleString('es-ES')}`;
                        metaItems.push(`<span class="text-primary fw-bold">${montoFormateado}</span>`);
                    }
                    
                    // Estado de la factura con colores
                    if (item.status !== undefined) {
                        const isPagada = Number(item.status) === 1;
                        let estadoHtml = '';
                        
                        console.log('🎯 Estado factura:', { status: item.status, isPagada });
                        
                        if (isPagada) {
                            estadoHtml = '<span class="badge bg-success text-white">✅ Pagada</span>';
                        } else {
                            // Verificar si está vencida
                            const fechaVencimiento = item.expiry || item.fecha_vencimiento;
                            const hoy = new Date();
                            hoy.setHours(0, 0, 0, 0);
                            
                            let estaVencida = false;
                            if (fechaVencimiento) {
                                const fechaVenc = new Date(fechaVencimiento);
                                fechaVenc.setHours(0, 0, 0, 0);
                                estaVencida = fechaVenc < hoy;
                            }
                            
                            if (estaVencida) {
                                estadoHtml = '<span class="badge bg-danger text-white">⚠️ Vencida</span>';
                            } else {
                                estadoHtml = '<span class="badge bg-warning text-dark">⏳ Pendiente</span>';
                            }
                        }
                        
                        metaItems.push(estadoHtml);
                    } else {
                        console.log('❌ Status undefined para factura:', item.id);
                        metaItems.push('<span class="badge bg-secondary text-white">❓ Sin status</span>');
                    }
                    
                    const resultado = metaItems.join(' ');
                    console.log('📤 Meta resultado:', resultado);
                    return resultado;
                default:
                    return '';
            }
        }

        formatServerResults(serverData) {
            const results = [];
            
            Object.entries(serverData).forEach(([entity, items]) => {
                if (Array.isArray(items)) {
                    items.forEach(item => {
                        const result = {
                            id: item.id,
                            entity: entity,
                            title: this.getItemTitle(item, entity),
                            subtitle: this.getItemSubtitle(item, entity),
                            meta: this.getItemMeta(item, entity),
                            data: item,
                            relevance: item.relevance || 0
                        };
                        console.log('📦 Resultado formateado:', result);
                        results.push(result);
                    });
                }
            });

            return results;
        }

        renderResultItem(result) {
            console.log('🎨 renderResultItem - Entrada:', result);
            
            let entityType = result.entity;
            let iconClass = this.getEntityIcon(result.entity);
            
            if (result.entity === 'facturas' && result.data) {
                if (result.data.client_id || result.data.cliente_id || result.data.cliente_name) {
                    entityType = 'factura-cliente';
                    iconClass = 'fas fa-file-invoice';
                } else if (result.data.provider_id || result.data.proveedor_id || result.data.proveedor_name) {
                    entityType = 'factura-proveedor';
                    iconClass = 'fas fa-file-invoice-dollar';
                }
            }
            
            const html = `
                <div class="search-result-item">
                    <div class="search-result-icon ${entityType}">
                        <i class="${iconClass}"></i>
                    </div>
                    <div class="search-result-content">
                        <div class="search-result-title">${result.title}</div>
                        <div class="search-result-subtitle">${result.subtitle}</div>
                        ${result.meta ? `<div class="search-result-meta">${result.meta}</div>` : '<div class="text-muted">Sin meta</div>'}
                    </div>
                </div>
            `;
            
            console.log('🖼️ HTML generado:', html);
            return html;
        }

        displayResults(results) {
            const container = document.getElementById('search-results');
            let html = '<div class="search-section-header">Facturas (Test)</div>';
            
            results.forEach(result => {
                html += this.renderResultItem(result);
            });
            
            container.innerHTML = html;
            container.style.display = 'block';
        }
    }

    // Crear instancia del test
    const testManager = new TestSearchManager();

    // Datos de prueba
    const testData = {
        facturas: [
            {
                id: 1,
                invoice: "12345",
                amount: 150000,
                status: 1,
                expiry: '2024-12-01',
                cliente_name: 'Juan Pérez S.A.',
                date: '2024-11-15'
            },
            {
                id: 2,
                invoice: "12346", 
                amount: 320500,
                status: 0,
                expiry: '2025-02-15',
                proveedor_name: 'Construcciones ABC Ltda.',
                date: '2024-11-20'
            },
            {
                id: 3,
                invoice: "12347",
                amount: 75000,
                status: 0,
                expiry: '2024-11-01',
                cliente_name: 'María González',
                date: '2024-10-15'
            }
        ]
    };

    // Event listeners
    document.getElementById('testBtn').addEventListener('click', function() {
        consoleOutput = '';
        console.log('🚀 Iniciando test...');
        
        const results = testManager.formatServerResults(testData);
        testManager.displayResults(results);
        
        console.log('✅ Test completado');
    });

    document.getElementById('clearBtn').addEventListener('click', function() {
        document.getElementById('search-results').style.display = 'none';
        consoleOutput = '';
        document.getElementById('console-output').value = '';
    });
    </script>
</body>
</html>
