version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: laravel-app
    container_name: laravel-app
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/test
    working_dir: /var/www/test
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_KEY=base64:dummykey
    depends_on: []
