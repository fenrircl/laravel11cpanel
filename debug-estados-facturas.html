<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Buscador - Estados Facturas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <h2 class="mb-4">Debug - Estados de Facturas en Buscador</h2>
        
        <div class="row">
            <div class="col-md-6">
                <h5>Test con datos simulados:</h5>
                <div id="test-results"></div>
            </div>
            <div class="col-md-6">
                <h5>Lógica del método getItemMeta:</h5>
                <textarea id="debug-output" class="form-control" rows="15" readonly></textarea>
            </div>
        </div>
    </div>

    <script>
    // Simular la función getItemMeta del buscador
    function getItemMeta(item, entity) {
        console.log('getItemMeta llamada con:', { item, entity });
        
        switch (entity) {
            case 'facturas':
                const metaItems = [];
                
                // Mostrar monto si está disponible
                const monto = item.amount || item.total || item.monto;
                if (monto) {
                    const montoFormateado = `$${Number(monto).toLocaleString('es-ES')}`;
                    metaItems.push(`<span class="text-primary fw-bold">${montoFormateado}</span>`);
                }
                
                // Estado de la factura con colores
                if (item.status !== undefined) {
                    const isPagada = Number(item.status) === 1;
                    let estadoHtml = '';
                    
                    if (isPagada) {
                        estadoHtml = '<span class="badge bg-success text-white">✅ Pagada</span>';
                    } else {
                        // Verificar si está vencida
                        const fechaVencimiento = item.expiry || item.fecha_vencimiento;
                        const hoy = new Date();
                        hoy.setHours(0, 0, 0, 0);
                        
                        let estaVencida = false;
                        if (fechaVencimiento) {
                            const fechaVenc = new Date(fechaVencimiento);
                            fechaVenc.setHours(0, 0, 0, 0);
                            estaVencida = fechaVenc < hoy;
                        }
                        
                        if (estaVencida) {
                            estadoHtml = '<span class="badge bg-danger text-white">⚠️ Vencida</span>';
                        } else {
                            estadoHtml = '<span class="badge bg-warning text-dark">⏳ Pendiente</span>';
                        }
                    }
                    
                    metaItems.push(estadoHtml);
                } else {
                    metaItems.push('<span class="text-danger">❌ Sin status</span>');
                }
                
                console.log('metaItems resultado:', metaItems);
                return metaItems.join(' ');
            default:
                return '';
        }
    }

    // Datos de prueba que simulan lo que viene del servidor
    const facturasPrueba = [
        {
            id: 1,
            amount: 150000,
            status: 1,
            expiry: '2024-12-01',
            cliente_name: 'Juan Pérez',
            date: '2024-11-15'
        },
        {
            id: 2,
            amount: 320500,
            status: 0,
            expiry: '2025-02-15',
            proveedor_name: 'Construcciones ABC',
            date: '2024-11-20'
        },
        {
            id: 3,
            amount: 75000,
            status: 0,
            expiry: '2024-11-01',
            cliente_name: 'María González',
            date: '2024-10-15'
        },
        {
            id: 4,
            amount: 45000,
            status: undefined, // Sin status definido
            cliente_name: 'Sin Status',
            date: '2024-11-15'
        }
    ];

    let debugOutput = '';
    let testResultsHtml = '';

    facturasPrueba.forEach((factura, index) => {
        debugOutput += `\n=== Factura ${index + 1} ===\n`;
        debugOutput += `Datos de entrada: ${JSON.stringify(factura, null, 2)}\n`;
        
        const meta = getItemMeta(factura, 'facturas');
        debugOutput += `Meta generado: ${meta}\n`;
        debugOutput += `¿Tiene status?: ${factura.status !== undefined}\n`;
        debugOutput += `Status value: ${factura.status}\n`;
        debugOutput += `Status como número: ${Number(factura.status)}\n`;
        debugOutput += `¿Es pagada?: ${Number(factura.status) === 1}\n\n`;
        
        testResultsHtml += `
            <div class="card mb-2">
                <div class="card-body p-2">
                    <h6>Factura #${factura.id}</h6>
                    <div class="search-result-meta">${meta}</div>
                </div>
            </div>
        `;
    });

    document.getElementById('test-results').innerHTML = testResultsHtml;
    document.getElementById('debug-output').value = debugOutput;
    </script>

    <style>
    /* Incluir algunos estilos básicos para los badges */
    .search-result-meta {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }
    
    .badge {
        font-size: 0.75rem !important;
        font-weight: 600 !important;
        padding: 4px 8px !important;
        border-radius: 4px !important;
        display: inline-flex;
        align-items: center;
        gap: 4px;
    }
    
    .bg-success {
        background: linear-gradient(135deg, #28a745 0%, #20c997 100%) !important;
        color: white !important;
    }
    
    .bg-warning {
        background: linear-gradient(135deg, #ffc107 0%, #fd7e14 100%) !important;
        color: #212529 !important;
    }
    
    .bg-danger {
        background: linear-gradient(135deg, #dc3545 0%, #c82333 100%) !important;
        color: white !important;
    }
    </style>
</body>
</html>
